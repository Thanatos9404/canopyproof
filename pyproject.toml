[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldproof"
version = "0.1.0"
description = "Krishyak FieldProof: verifiable, blockchain-anchored field-level climate and vegetation records for smallholder farms"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yashvardhan Thanvi", email = "yashvt9404@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "rasterio>=1.4",
  "scikit-learn>=1.4",
  "httpx>=0.27",
  "web3>=7.6,<8",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fieldproof = "fieldproof.cli:main"

[tool.setuptools]
packages = ["fieldproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["chain: starts a throw-away local Hardhat node (needs contracts/node_modules)"]
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]
