[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canopyproof"
version = "0.2.0"
description = "CanopyProof: open, satellite-verified integrity monitoring for forest carbon credits, anchored on-chain"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yashvardhan Thanvi", email = "yashvt9404@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "rasterio>=1.4",
  "scikit-learn>=1.4",
  "httpx>=0.27",
  "web3>=7.6,<8",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
canopyproof = "canopyproof.cli:main"

[tool.setuptools]
packages = ["canopyproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["chain: starts a throw-away local Hardhat node (needs contracts/node_modules)"]
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]
